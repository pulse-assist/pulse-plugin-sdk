[project]
name = "pulse-plugin"
version = "1.3.0"
description = "Плагины «Пульса»: серверная часть (окружение, команды, API, сигналы), тесты без Пульса, утилита pulse-plugin"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "pymongo>=4.6"]

[project.scripts]
pulse-plugin = "pulse_plugin.dev:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pulse_plugin"]

[tool.setuptools.package-data]
pulse_plugin = ["manifest.schema.json"]
